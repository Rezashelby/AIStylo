# AIStylo — local stack.
#
#   docker compose up app                     the app, standalone, on :3000
#   docker compose --profile edge up          + nginx reverse proxy on :8080
#   docker compose --profile data up          + Postgres/pgvector + Redis
#   docker compose --profile dev up           hot-reloading Vite on :5173
#
# `app` is self-contained: it builds and serves the SPA over Node and needs
# no other service. Everything below it is additive.

name: aistylo

services:
  # ── Application ───────────────────────────────────────────────────────
  # Runs on its own. `docker run -p 3000:3000 aistylo/app` works with no
  # compose file at all.
  app:
    build:
      context: .
      target: runtime
      args:
        VITE_STYLIST_API: ${VITE_STYLIST_API:-}
        VITE_STYLIST_API_KEY: ${VITE_STYLIST_API_KEY:-}
    image: aistylo/app:latest
    environment:
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── Edge proxy (profile: edge) ────────────────────────────────────────
  # TLS termination, rate limiting, and /api routing once a backend exists.
  # Optional: the app serves fine without it.
  proxy:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── Hot-reload dev server (profile: dev) ──────────────────────────────
  dev:
    profiles: ["dev"]
    # Dependencies are installed at build time (Dockerfile `dev` stage).
    # After changing package.json: docker compose --profile dev up --build -V
    build:
      context: .
      target: dev
    image: aistylo/dev:latest
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      # Anonymous volume: stops the bind mount above from hiding the
      # image's node_modules. Nothing is installed at container start.
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  # ── Postgres + pgvector (profile: data) ───────────────────────────────
  db:
    profiles: ["data"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aistylo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aistylo_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-aistylo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - aistylo_pgdata:/var/lib/postgresql/data
      # Anything in here runs once, on an empty data directory.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aistylo} -d ${POSTGRES_DB:-aistylo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis: sessions, carts, rate limiting (profile: data) ─────────────
  cache:
    profiles: ["data"]
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aistylo_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  aistylo_pgdata:
  aistylo_redis:
