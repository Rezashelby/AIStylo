# ─────────────────────────────────────────────────────────────────────────
# AIStylo edge proxy.
#
# Sits in front of the app container; serves nothing itself. This is the
# place for concerns that belong at the edge rather than in the app:
# TLS termination, rate limiting, compression, and routing /api to a
# backend once one exists.
#
# The app runs perfectly well without this — see the Dockerfile.
# ─────────────────────────────────────────────────────────────────────────

upstream aistylo_app {
  # Compose resolves `app` via its internal DNS.
  server app:3000;
  keepalive 16;
}

# Rate limits: generous for page loads, tighter for the styling endpoint,
# which is the expensive one once a real model is behind it.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=stylist:10m rate=4r/s;

server {
  listen 80;
  server_name _;

  # Requests larger than this are not something a storefront needs.
  client_max_body_size 2m;
  client_body_timeout 12s;
  client_header_timeout 12s;

  # Do not advertise the exact nginx version.
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml font/woff font/woff2;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;

  # The proxy's own health, independent of the app being up.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Confirms the app behind the proxy is reachable.
  location = /healthz/upstream {
    access_log off;
    proxy_pass http://aistylo_app/healthz;
  }

  # Reserved for the Phase 2 stylist backend. Returns 501 until a service
  # is wired up, which is clearer than a proxy error.
  location /api/ {
    limit_req zone=stylist burst=8 nodelay;
    return 501 "Stylist API not configured\n";
    add_header Content-Type text/plain always;
  }

  location / {
    limit_req zone=general burst=60 nodelay;
    proxy_pass http://aistylo_app;
  }
}
